<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tín Hiệu Sàn – nền tảng cảnh báo sớm rủi ro vi phạm quy định niêm yết của doanh nghiệp trên HOSE và HNX." />
    <meta name="theme-color" content="#0a0d13" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Tín Hiệu Sàn – Cảnh báo sớm rủi ro niêm yết</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("radar.theme") || '"dark"');
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
